<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APRS Webchat</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <!-- Obsidian Style -->
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">APRS Webchat</a>
        <span class="navbar-text ms-auto">{{ callsign }}</span>
    </div>
</nav>

<main class="container my-5">
    <div class="row g-4">
        <aside class="col-md-3">
            <div class="card mb-3">
                <div class="card-header bg-primary text-white">Callsigns</div>
                <ul class="list-group list-group-flush" id="callsign-list">
                    {% for cs in callsigns %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span class="callsign-item" data-callsign="{{ cs }}" role="button">{{ cs }}</span>
                        <form method="post" action="/callsigns/remove" class="ms-2">
                            <input type="hidden" name="callsign" value="{{ cs }}">
                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Remove {{ cs }}">&times;</button>
                        </form>
                    </li>
                    {% else %}
                    <li class="list-group-item text-muted">No callsigns yet</li>
                    {% endfor %}
                </ul>
                <div class="card-body">
                    <form method="post" action="/callsigns/add" class="d-flex gap-2">
                        <input type="text" name="callsign" class="form-control form-control-sm" placeholder="Add callsign" required>
                        <button type="submit" class="btn btn-sm btn-primary">Add</button>
                    </form>
                </div>
            </div>
        </aside>
        <div class="col-md-9">
            <div class="content-card">
                {% block content %}{% endblock %}
            </div>

            <div class="content-card mt-4">
                <div class="panel-heading-row">
                    <h2 class="panel-heading">Station Map</h2>
                    <button class="btn btn-sm btn-outline-light panel-toggle-btn" type="button" data-bs-toggle="collapse" data-bs-target="#map-collapse" aria-expanded="true" aria-controls="map-collapse">
                        <span class="collapse-icon">▾</span>
                    </button>
                </div>

                <div class="collapse show" id="map-collapse">
                    <ul class="nav nav-tabs" id="map-tabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="map-tab-btn" data-bs-toggle="tab" data-bs-target="#map-pane" type="button" role="tab">Map</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="positions-tab-btn" data-bs-toggle="tab" data-bs-target="#positions-pane" type="button" role="tab">Positions</button>
                        </li>
                    </ul>
                    <div class="tab-content pt-3">
                        <div class="tab-pane fade show active" id="map-pane" role="tabpanel">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <small class="text-muted">Drag the map's bottom-right corner to resize</small>
                                <button type="button" id="reset-map-size-btn" class="btn btn-sm btn-link p-0">Reset size</button>
                            </div>
                            <div id="map"></div>

                            <form method="post" action="/send_position" class="mt-3">
                                <div class="search-wrapper">
                                    <input type="text" class="form-control" id="lat" name="lat" placeholder="Latitude (e.g. 39.7392)" required>
                                    <input type="text" class="form-control" id="lon" name="lon" placeholder="Longitude (e.g. -104.9903)" required>
                                    <button type="button" id="use-location-btn" class="btn btn-outline-light" title="Use my current location">📍</button>
                                    <button type="submit" class="btn btn-primary">Send Position</button>
                                </div>
                            </form>
                        </div>
                        <div class="tab-pane fade" id="positions-pane" role="tabpanel">
                            <pre id="positions-text" class="positions-box">No positions received yet.</pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container text-center">
        Version {{ version }}
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let fetchInterval;
    let map;
    let myLocationMarker;
    const markers = {};

    function pinIcon(className, color, strokeColor) {
        return L.divIcon({
            className: className,
            html: `<svg width="20" height="26" viewBox="0 0 24 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20c0-6.6-5.4-12-12-12z" fill="${color}" stroke="${strokeColor}" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="5" fill="${strokeColor}"/>
            </svg>`,
            iconSize: [20, 26],
            iconAnchor: [10, 26],
            popupAnchor: [0, -23]
        });
    }

    const myLocationIcon = pinIcon('my-location-pin', '#22d3ee', '#083344');
    const stationIcon = pinIcon('station-pin', '#22c55e', '#052e13');

    function showMyLocation(lat, lon) {
        if (!map) return;
        const latlng = [lat, lon];
        if (myLocationMarker) {
            myLocationMarker.setLatLng(latlng);
        } else {
            myLocationMarker = L.marker(latlng, { icon: myLocationIcon }).addTo(map);
            myLocationMarker.bindTooltip('{{ callsign }} (You)', { permanent: true, direction: 'top', offset: [0, -20] });
        }
        myLocationMarker.bindPopup('You are here');
        map.setView(latlng, 10);
    }

    function initMap() {
        const mapEl = document.getElementById('map');
        if (!mapEl) return;

        try {
            const savedHeight = localStorage.getItem('aprschat_map_height');
            if (savedHeight) {
                mapEl.style.height = savedHeight;
            }
        } catch (e) {
            console.log('Could not read saved map height:', e);
        }

        map = L.map('map').setView([39.8283, -98.5795], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let resizeSaveTimeout;
        new ResizeObserver(entries => {
            map.invalidateSize();
            clearTimeout(resizeSaveTimeout);
            resizeSaveTimeout = setTimeout(() => {
                try {
                    localStorage.setItem('aprschat_map_height', `${Math.round(entries[0].contentRect.height)}px`);
                } catch (e) {
                    console.log('Could not save map height:', e);
                }
            }, 300);
        }).observe(mapEl);
    }

    function updatePositionsText(data) {
        const el = document.getElementById('positions-text');
        if (!el) return;
        if (!data || data.length === 0) {
            el.textContent = 'No positions received yet.';
            return;
        }
        el.textContent = data.map(function(pos) {
            const comment = pos.comment ? ` — ${pos.comment}` : '';
            return `${pos.from.padEnd(10)} ${pos.lat.toFixed(5)}, ${pos.lon.toFixed(5)}${comment}  (${pos.time})`;
        }).join('\n');
    }

    function fetchPositions() {
        if (!map) return;
        $.get('/get_positions', function(data) {
            if (!data) return;
            data.forEach(function(pos) {
                const latlng = [pos.lat, pos.lon];
                if (markers[pos.from]) {
                    markers[pos.from].setLatLng(latlng);
                } else {
                    markers[pos.from] = L.marker(latlng, { icon: stationIcon }).addTo(map);
                    markers[pos.from].bindTooltip(pos.from, { permanent: true, direction: 'top', offset: [0, -20] });
                }
                markers[pos.from].bindPopup(`<strong>${pos.from}</strong><br>${pos.comment || ''}<br><small>${pos.time}</small>`);
            });
            updatePositionsText(data);
        }).fail(function(xhr, status, error) {
            console.log("Error fetching positions:", error);
        });
    }

    function fetchMessages() {
        $.get("/get_messages", function(data) {
            if (!data || data.length === 0) {
                console.log("No new messages received.");
                return;
            }

            $('.chat-box').empty();

            data.forEach(function(entry) {
                var messageClass = entry.direction === 'in' ? 'from-others' : 'from-me';
                var messageHTML = `
                    <div class="message ${messageClass}">
                        <div class="text">${entry.msg}</div>
                        <div class="time">
                            ${entry.direction === 'in' ? `From ${entry.from}` : `To ${entry.to}`} — ${  entry.time}
                        </div>
                    </div>
                `;
                $('.chat-box').append(messageHTML);
            });

            $('.chat-box').scrollTop($('.chat-box')[0].scrollHeight);
        }).fail(function(xhr, status, error) {
            console.log("Error fetching messages:", error);
        });
    }

    $(document).ready(function() {
        fetchMessages();

        if (!fetchInterval) {
            fetchInterval = setInterval(fetchMessages, 5000);
        }

        initMap();
        fetchPositions();
        setInterval(fetchPositions, 15000);

        $('#map-tab-btn').on('shown.bs.tab', function() {
            if (map) map.invalidateSize();
        });

        $('#map-collapse').on('shown.bs.collapse', function() {
            if (map) map.invalidateSize();
        });

        $('#reset-map-size-btn').on('click', function() {
            const mapEl = document.getElementById('map');
            mapEl.style.height = '';
            try {
                localStorage.removeItem('aprschat_map_height');
            } catch (e) {
                console.log('Could not clear saved map height:', e);
            }
            if (map) map.invalidateSize();
        });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                showMyLocation(position.coords.latitude, position.coords.longitude);
            }, function(err) {
                console.log('Geolocation unavailable:', err);
            });
        }

        $('#clear-chat-btn').on('click', function() {
            $('.chat-box').empty();

            $.post("/clear_messages", function(response) {
                if (response.status === "success") {
                    console.log("Message buffer cleared!");
                } else {
                    console.log("Failed to clear message buffer");
                }
            }).fail(function(xhr, status, error) {
                console.log("Error clearing message buffer:", error);
            });
        });

        const flashMessages = document.querySelectorAll('.flash-messages');
        if (flashMessages.length > 0) {
            setTimeout(() => {
                flashMessages.forEach(el => {
                    el.classList.add('hide');
                    setTimeout(() => el.remove(), 500);
                });
            }, 4000);
        }

        $('#use-location-btn').on('click', function() {
            if (!navigator.geolocation) {
                alert('Geolocation is not supported by this browser.');
                return;
            }
            const btn = $(this);
            btn.prop('disabled', true);
            navigator.geolocation.getCurrentPosition(function(position) {
                $('#lat').val(position.coords.latitude.toFixed(5));
                $('#lon').val(position.coords.longitude.toFixed(5));
                showMyLocation(position.coords.latitude, position.coords.longitude);
                btn.prop('disabled', false);
            }, function(err) {
                console.log('Geolocation error:', err);
                alert('Could not get your location: ' + err.message);
                btn.prop('disabled', false);
            });
        });

        $('.callsign-item').on('click', function() {
            const callsign = $(this).data('callsign').toString();
            const input = $('#to_callsign');
            let current = input.val().split(',').map(s => s.trim()).filter(Boolean);
            const idx = current.indexOf(callsign);

            if (idx === -1) {
                current.push(callsign);
                $(this).addClass('selected');
            } else {
                current.splice(idx, 1);
                $(this).removeClass('selected');
            }

            input.val(current.join(', '));
        });
    });
</script>

</body>
</html>
