<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APRS Webchat</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Obsidian Style -->
    <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">APRS Webchat</a>
        <span class="navbar-text ms-auto">{{ callsign }}</span>
    </div>
</nav>

<main class="container my-5">
    <div class="content-card">
        {% block content %}{% endblock %}
    </div>
</main>

<footer>
    <div class="container text-center">
        Version {{ version }}
    </div>
</footer>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    let fetchInterval;

    function fetchMessages() {
        $.get("/get_messages", function(data) {
            if (!data || data.length === 0) {
                console.log("No new messages received.");
                return;
            }

            $('.chat-box').empty();

            data.forEach(function(entry) {
                var messageClass = entry.direction === 'in' ? 'from-others' : 'from-me';
                var messageHTML = `
                    <div class="message ${messageClass}">
                        <div class="text">${entry.msg}</div>
                        <div class="time">
                            ${entry.direction === 'in' ? `From ${entry.from}` : `To ${entry.to}`} — ${  entry.time}
                        </div>
                    </div>
                `;
                $('.chat-box').append(messageHTML);
            });

            $('.chat-box').scrollTop($('.chat-box')[0].scrollHeight);
        }).fail(function(xhr, status, error) {
            console.log("Error fetching messages:", error);
        });
    }

    $(document).ready(function() {
        fetchMessages();

        if (!fetchInterval) {
            fetchInterval = setInterval(fetchMessages, 5000);
        }

        $('#clear-chat-btn').on('click', function() {
            $('.chat-box').empty();

            $.post("/clear_messages", function(response) {
                if (response.status === "success") {
                    console.log("Message buffer cleared!");
                } else {
                    console.log("Failed to clear message buffer");
                }
            }).fail(function(xhr, status, error) {
                console.log("Error clearing message buffer:", error);
            });
        });

        const flashMessages = document.querySelectorAll('.flash-messages');
        if (flashMessages.length > 0) {
            setTimeout(() => {
                flashMessages.forEach(el => {
                    el.classList.add('hide');
                    setTimeout(() => el.remove(), 500);
                });
            }, 4000);
        }
    });
</script>

</body>
</html>
